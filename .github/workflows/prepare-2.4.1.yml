name: Prepare 2.4.1 build

on:
  push:
    branches: [main]
    paths: ['.github/workflows/prepare-2.4.1.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-smart-categories-grid-2-4-1
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          coverage: none
      - name: Synchronize 2.4.1 metadata and release notes
        shell: python
        run: |
          from pathlib import Path
          import json
          import re
          version = '2.4.1'
          main = Path('smart-categories-grid.php')
          text = main.read_text()
          header = re.findall(r'(?m)^Version:[ \t]*([^\r\n]+)$', text)
          constant = re.findall(r"private const VERSION\s*=\s*'([^']+)';", text)
          if len(header) != 1 or len(constant) != 1:
              raise SystemExit('Expected one header version and one class VERSION constant')
          if header[0] != constant[0] or header[0] not in ('2.4.0', version):
              raise SystemExit('Unexpected source version; refusing to downgrade or overwrite')
          text = re.sub(r'(?m)^Version:[^\r\n]+$', 'Version: ' + version, text, count=1)
          text = re.sub(r"private const VERSION\s*=\s*'[^']+';", "private const VERSION = '" + version + "';", text, count=1)
          main.write_text(text)
          block = Path('block/block.json')
          metadata = json.loads(block.read_text())
          if metadata.get('version') not in ('2.4.0', version):
              raise SystemExit('Unexpected block version')
          metadata['version'] = version
          block.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + '\n')
          readme = Path('README.md')
          doc = readme.read_text()
          notes = """### Version 2.4.1
          - Bump the PHP header, runtime version and block metadata to 2.4.1.
          - Refresh versioned CSS and JavaScript URLs with `ver=2.4.1`, including the late stylesheet fallback.
          - Rotate HTML grid cache keys through the runtime-version component; no global cache flush.
          - Include the stabilized CSS, transform-only hover motion and browser layout checks from the preceding changes.
          - Rebuild minified CSS and verify the installation ZIP and SHA-256 checksum during preparation.

          """
          if '### Version ' + version not in doc:
              if doc.count('## Changelog\n') != 1:
                  raise SystemExit('Expected one Changelog heading')
              doc = doc.replace('## Changelog\n', '## Changelog\n\n' + notes, 1)
              readme.write_text(doc)
          pot = Path('languages/smart-cat-grid.pot')
          translations = pot.read_text()
          translations, count = re.subn(r'Project-Id-Version: Smart Categories Grid 2\.4\.[01]', 'Project-Id-Version: Smart Categories Grid ' + version, translations)
          if count != 1:
              raise SystemExit('Expected one translation project version')
          pot.write_text(translations)
          performance = Path('PERFORMANCE.md')
          report = performance.read_text()
          marker = '## Release 2.4.1 asset cache update'
          if marker not in report:
              report += '\n' + marker + '\n\nRelease 2.4.1 supersedes the earlier same-version deployment note: CSS and JavaScript asset URLs now use `ver=2.4.1`. The HTML grid cache also includes the new runtime version. This does not flush shared caches; caches serving an older complete HTML page may still require a targeted purge. The previously executed synthetic layout checks are not live-site PageSpeed or field INP measurements.\n'
              performance.write_text(report)
          assert re.search(r'(?m)^Version: 2\.4\.1$', main.read_text())
          assert "private const VERSION = '2.4.1';" in main.read_text()
          assert json.loads(block.read_text())['version'] == version
          print('Version metadata synchronized:', version)
      - name: Rebuild production stylesheet
        run: |
          set -euo pipefail
          npx --yes clean-css-cli@5 -O1 -o assets/front.min.css assets/front.css
          test -s assets/front.min.css
      - name: PHP syntax and isolated regression tests
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php .github/tests/smoke.php
          node --check block/index.js
          node --check assets/admin.js
      - name: Install browser test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/scg-layout"
          "$RUNNER_TEMP/scg-layout/bin/pip" install playwright==1.51.0
          echo "$RUNNER_TEMP/scg-layout/bin" >> "$GITHUB_PATH"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Browser layout regression checks
        run: python .github/tests/layout.py
      - name: Build installation ZIP and checksum
        run: |
          set -euo pipefail
          STAGING=$(mktemp -d)
          mkdir -p "$STAGING/smart-categories-grid" artifacts
          rsync -a ./ "$STAGING/smart-categories-grid/" --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='.gitattributes' --exclude='.editorconfig' --exclude='artifacts' --exclude='*.zip' --exclude='*.sha256'
          (cd "$STAGING" && zip -rq "$GITHUB_WORKSPACE/artifacts/smart-categories-grid-2.4.1.zip" smart-categories-grid)
          (cd artifacts && sha256sum smart-categories-grid-2.4.1.zip > smart-categories-grid-2.4.1.zip.sha256)
      - name: Verify ZIP content and version
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import re
          archive = Path('artifacts/smart-categories-grid-2.4.1.zip')
          with ZipFile(archive) as package:
              assert package.testzip() is None
              names = package.namelist()
              assert all(n.startswith('smart-categories-grid/') for n in names)
              assert not any('/.github/' in n or '/.git/' in n for n in names)
              php = package.read('smart-categories-grid/smart-categories-grid.php').decode()
              assert re.search(r'(?m)^Version: 2\.4\.1$', php)
              assert "private const VERSION = '2.4.1';" in php
              assert json.loads(package.read('smart-categories-grid/block/block.json'))['version'] == '2.4.1'
              assert package.read('smart-categories-grid/assets/front.min.css')
          expected = Path(str(archive) + '.sha256').read_text().split()[0]
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == expected
          print('Verified installation archive:', archive.name)
      - uses: actions/upload-artifact@v4
        with:
          name: smart-categories-grid-2.4.1
          path: artifacts/
          if-no-files-found: error
      - name: Commit versioned source only after checks and packaging
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add smart-categories-grid.php block/block.json README.md languages/smart-cat-grid.pot PERFORMANCE.md assets/front.min.css
          if ! git diff --cached --quiet; then
            git commit -m 'release: prepare 2.4.1 and refresh asset cache keys'
            git push origin HEAD:main
          fi
