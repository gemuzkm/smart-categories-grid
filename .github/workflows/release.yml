name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_SLUG: smart-categories-grid

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, intl
          coverage: none

      - name: PHP syntax check
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Read plugin version
        id: meta
        run: |
          set -e
          HEADER_VERSION=$(grep -m1 -E '^\s*Version:' "${PLUGIN_SLUG}.php" | sed -E 's/^\s*Version:\s*//; s/\s+$//')
          CONST_VERSION=$(grep -m1 -E "const VERSION\s*=\s*'[^']+'" "${PLUGIN_SLUG}.php" | sed -E "s/.*'([^']+)'.*/\1/")
          BLOCK_VERSION=$(grep -m1 '"version"' block/block.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "Header version: ${HEADER_VERSION}"
          echo "Const  version: ${CONST_VERSION}"
          echo "Block  version: ${BLOCK_VERSION}"
          if [ "${HEADER_VERSION}" != "${CONST_VERSION}" ]; then
            echo "::error::Plugin header Version (${HEADER_VERSION}) does not match class constant VERSION (${CONST_VERSION})"
            exit 1
          fi
          if [ "${HEADER_VERSION}" != "${BLOCK_VERSION}" ]; then
            echo "::error::Plugin header Version (${HEADER_VERSION}) does not match block/block.json version (${BLOCK_VERSION})"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "${TAG_VERSION}" != "${HEADER_VERSION}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin Version ${HEADER_VERSION}"
              exit 1
            fi
          fi
          echo "version=${HEADER_VERSION}" >> "$GITHUB_OUTPUT"

      # The ZIP always ships CSS minified from the tagged front.css, even if the
      # tag was pushed before the "Build assets" workflow committed its result.
      - name: Rebuild minified CSS
        run: |
          set -e
          npx --yes clean-css-cli@5 -O1 -o assets/front.min.css assets/front.css
          test -s assets/front.min.css
          OPEN=$(tr -cd '{' < assets/front.min.css | wc -c)
          CLOSE=$(tr -cd '}' < assets/front.min.css | wc -c)
          if [ "${OPEN}" -eq 0 ] || [ "${OPEN}" -ne "${CLOSE}" ]; then
            echo "::error::front.min.css has unbalanced braces (${OPEN} vs ${CLOSE})"
            exit 1
          fi
          grep -Eq 'repeat\(min\(var\(--scg-columns, ?6\), ?2\), ?1fr\)' assets/front.min.css \
            || { echo "::error::responsive grid rule is missing from front.min.css"; exit 1; }
          grep -Eq 'aspect-ratio: ?120 ?/ ?96' assets/front.min.css \
            || { echo "::error::aspect-ratio rule is missing from front.min.css"; exit 1; }
          ls -l assets/front.css assets/front.min.css

      # One stylesheet per grid style, built from the same tagged front.css.
      - name: Build per-style stylesheets
        run: |
          set -e
          node .github/scripts/build-css.js "$RUNNER_TEMP/scg-css"
          for style in classic modern minimal card text; do
            npx --yes clean-css-cli@5 -O1 -o "assets/front-$style.min.css" "$RUNNER_TEMP/scg-css/front-$style.css"
            test -s "assets/front-$style.min.css"
          done
          ls -l assets/front-*.min.css

      - name: Extract changelog for this version
        id: changelog
        run: |
          set -e
          VERSION="${{ steps.meta.outputs.version }}"
          NOTES=$(awk -v v="### Version ${VERSION}" '
            $0 == v {flag=1; next}
            /^### Version / && flag {exit}
            flag {print}
          ' README.md | sed -e '/./,$!d')
          if [ -z "${NOTES}" ]; then
            NOTES="See README.md for details."
          fi
          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build plugin ZIP
        id: build
        run: |
          set -e
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD_DIR="$(mktemp -d)"
          STAGE="${BUILD_DIR}/${PLUGIN_SLUG}"
          mkdir -p "${STAGE}"
          rsync -a ./ "${STAGE}/" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude '.editorconfig' \
            --exclude 'work' \
            --exclude '*.zip'
          ZIP_NAME="${PLUGIN_SLUG}-${VERSION}.zip"
          (cd "${BUILD_DIR}" && zip -rq "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${PLUGIN_SLUG}")
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"
          unzip -l "${ZIP_NAME}"
          echo "zip=${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.zip }}
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.zip }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: Smart Categories Grid ${{ steps.meta.outputs.version }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
          files: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.zip }}.sha256
          fail_on_unmatched_files: true
