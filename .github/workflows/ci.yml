name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  consistency:
    name: Version & assets consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Header Version == class VERSION
        run: |
          set -e
          H=$(grep -m1 -E '^\s*Version:' smart-categories-grid.php | sed -E 's/^\s*Version:\s*//; s/\s+$//')
          C=$(grep -m1 -E "const VERSION\s*=\s*'[^']+'" smart-categories-grid.php | sed -E "s/.*'([^']+)'.*/\1/")
          echo "header=$H const=$C"
          [ "$H" = "$C" ] || { echo "::error::Version mismatch: header=$H const=$C"; exit 1; }

      - name: Changelog entry exists for current version
        run: |
          set -e
          H=$(grep -m1 -E '^\s*Version:' smart-categories-grid.php | sed -E 's/^\s*Version:\s*//; s/\s+$//')
          grep -q "^### Version ${H}$" README.md || { echo "::error::README.md has no '### Version ${H}' changelog section"; exit 1; }

      - name: Minified CSS present
        run: test -f assets/front.min.css
