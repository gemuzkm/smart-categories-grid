name: Format PHP

# Applies the automatic fixes of the WordPress coding standards (phpcbf) to the plugin's PHP
# files and commits the result to the branch. Only formatting is changed; the syntax check and
# the regression fixtures must pass on the formatted code before anything is committed.
# A push made with GITHUB_TOKEN does not start other workflows, so there is no loop.

on:
  push:
    branches: ['feature/**']
    paths:
      - '.github/workflows/format.yml'
      - '.github/phpcs.xml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PHPCS_ARGS: --standard=.github/phpcs.xml smart-categories-grid.php uninstall.php

concurrency:
  group: format-php-${{ github.ref }}

jobs:
  format:
    name: phpcbf
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          coverage: none
          tools: composer

      - name: Install WordPress coding standards
        run: |
          set -e
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress wp-coding-standards/wpcs:^3.1
          echo "$(composer global config bin-dir --absolute)" >> "$GITHUB_PATH"

      - name: Apply automatic fixes
        run: |
          set +e
          phpcbf $PHPCS_ARGS
          code=$?
          set -e
          # 0 = nothing to fix, 1 = everything fixable was fixed, 2 = some violations cannot be fixed automatically.
          if [ "$code" -gt 2 ]; then
            echo "::error::phpcbf failed with exit code $code"
            exit "$code"
          fi

      - name: Verify the formatted code
        run: |
          set -e
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php .github/tests/smoke.php

      - name: Report remaining violations
        run: |
          phpcs $PHPCS_ARGS --report=summary || true
          phpcs $PHPCS_ARGS --report=full --report-file=phpcs-report.txt || true

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: phpcs-report
          path: phpcs-report.txt
          if-no-files-found: warn

      - name: Commit if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add smart-categories-grid.php uninstall.php
          if git diff --cached --quiet; then
            echo "PHP files already follow the automatic fixes"
          else
            git commit -m "style: apply WordPress coding standards automatic fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
